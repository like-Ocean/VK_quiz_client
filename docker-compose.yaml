version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE_URL: http://localhost:8000/api
        PUBLIC_WS_BASE_URL: ws://localhost:8000/api/ws
    container_name: vk_quiz_frontend
    restart: unless-stopped
    ports:
      - "5173:80"